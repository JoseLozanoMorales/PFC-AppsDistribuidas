name: CI

on:
  push:
    branches: [main, feature/entrega-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  crdb-tests:
    name: CockroachDB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/pedidos-service/pom.xml

      - name: Run pedidos-service tests with Testcontainers
        working-directory: services/pedidos-service
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crdb-test-reports
          path: services/pedidos-service/target/surefire-reports/
          if-no-files-found: ignore
