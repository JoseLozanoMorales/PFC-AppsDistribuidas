name: Publicar imágenes Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Apps/web/frontend/**"
      - "services/armado-ia/**"
      - "services/inventario-service/**"
      - "services/ordenes-proveedores-service/**"
      - "services/pedidos-service/**"
      - "services/productos-service/**"
      - "services/usuarios/**"
      - "services/ventas-service/**"
      - ".github/workflows/publish-images.yml"

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - image: frontend
            context: Apps/web/frontend
            dockerfile: Apps/web/frontend/Dockerfile
          - image: usuarios
            context: services/usuarios
            dockerfile: services/usuarios/Dockerfile
          - image: productos
            context: services/productos-service
            dockerfile: services/productos-service/Dockerfile
          - image: inventario
            context: .
            dockerfile: services/inventario-service/Dockerfile
          - image: pedidos
            context: .
            dockerfile: services/pedidos-service/Dockerfile
          - image: ventas
            context: services/ventas-service
            dockerfile: services/ventas-service/Dockerfile
          - image: ordenes-proveedores
            context: services/ordenes-proveedores-service
            dockerfile: services/ordenes-proveedores-service/Dockerfile
          - image: armado-ia
            context: services/armado-ia
            dockerfile: services/armado-ia/Dockerfile

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Habilitar emulación ARM64
        uses: docker/setup-qemu-action@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ matrix.image }}-latest
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ matrix.image }}-${{ steps.version.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
