services:
  tiendatech-crdb-1:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-1
    restart: unless-stopped
    command:
      - start
      - --insecure
      - --advertise-addr=tiendatech-crdb-1:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257
      - --locality=region=aws,zone=z1
      - --cache=64MiB
      - --max-sql-memory=64MiB
    ports:
      - "0.0.0.0:26257:26257"
      - "127.0.0.1:8091:8080"
    volumes:
      - crdb1-data:/cockroach/cockroach-data
    networks: [tiendatech-db-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tiendatech-crdb-2:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-2
    restart: unless-stopped
    command:
      - start
      - --insecure
      - --advertise-addr=tiendatech-crdb-2:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257
      - --locality=region=aws,zone=z2
      - --cache=64MiB
      - --max-sql-memory=64MiB
    ports:
      - "0.0.0.0:26258:26257"
      - "127.0.0.1:8092:8080"
    volumes:
      - crdb2-data:/cockroach/cockroach-data
    networks: [tiendatech-db-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tiendatech-crdb-3:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-3
    restart: unless-stopped
    command:
      - start
      - --insecure
      - --advertise-addr=tiendatech-crdb-3:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=tiendatech-crdb-1:26257,tiendatech-crdb-2:26257,tiendatech-crdb-3:26257
      - --locality=region=aws,zone=z3
      - --cache=64MiB
      - --max-sql-memory=64MiB
    ports:
      - "0.0.0.0:26259:26257"
      - "127.0.0.1:8093:8080"
    volumes:
      - crdb3-data:/cockroach/cockroach-data
    networks: [tiendatech-db-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tiendatech-crdb-init:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-init
    depends_on:
      tiendatech-crdb-1:
        condition: service_started
      tiendatech-crdb-2:
        condition: service_started
      tiendatech-crdb-3:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until cockroach sql --insecure --host=tiendatech-crdb-1:26257 -e "SELECT 1" >/dev/null 2>&1; do
          cockroach init --insecure --host=tiendatech-crdb-1:26257 >/dev/null 2>&1 || true;
          sleep 2;
        done;
        cockroach sql --insecure --host=tiendatech-crdb-1:26257 --file=/docs/db/schema.sql
    volumes:
      - ./docs/db/schema.sql:/docs/db/schema.sql:ro
    networks: [tiendatech-db-net]
    restart: "no"

volumes:
  crdb1-data:
  crdb2-data:
  crdb3-data:

networks:
  tiendatech-db-net:
    name: tiendatech-db-net
    driver: bridge
