openapi: 3.0.3

info:
  title: API REST de Productos - TiendaTech
  version: 1.0.0
  description: API REST para consultar, filtrar y buscar productos de una tienda de componentes de computadora.

servers:
  - url: http://localhost:8080
    description: Servidor local

security:
  - bearerAuth: []

tags:
  - name: Productos
    description: Endpoints relacionados con productos, búsqueda y categorías del catálogo.

paths:
  /api/productos:
    get:
      summary: Listar productos
      description: Retorna una lista paginada de productos registrados en la tienda.
      tags:
        - Productos
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página a consultar.
          schema:
            type: integer
            example: 0
        - name: size
          in: query
          required: false
          description: Cantidad de registros por página.
          schema:
            type: integer
            example: 50
      responses:
        "200":
          description: Productos listados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageProductoListDTO"
              example:
                content:
                  - id: 19
                    nombre: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
                    precio: 299.99
                    marca: "ASUS"
                    imagenId: 10
                    mimeType: "image/png"
                totalElements: 1
                totalPages: 1
                size: 50
                number: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/productos/{id}:
    get:
      summary: Detalle producto
      description: Retorna la información detallada de un producto por su identificador.
      tags:
        - Productos
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del producto.
          schema:
            type: integer
            example: 5
      responses:
        "200":
          description: Detalle del producto obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductoDetalleDTO"
              example:
                id: 5
                nombre: "Procesador Ryzen 5 5600G"
                precio: 145.99
                marca: "AMD"
                imagenId: 10
                mimeType: "image/png"
                galeria:
                  - galeriaId: 1
                    mimeType: "image/png"
                    esPortada: true
                    posicionGaleria: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/productos/por-categoria:
    get:
      summary: Por categoría
      description: Retorna productos asociados a una categoría específica.
      tags:
        - Productos
      parameters:
        - name: categoriaId
          in: query
          required: true
          description: Identificador de la categoría.
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Productos por categoría listados correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoCategoriaItemDTO"
              example:
                - id: 19
                  nombre: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
                  precio: 299.99
                  marca: "ASUS"
                  imagenId: 10
                  mimeType: "image/png"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/productos/buscar:
    post:
      summary: Buscar producto
      description: Busca productos según un texto enviado en el cuerpo de la solicitud.
      tags:
        - Productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuscarProductoRequest"
            example:
              texto: "asus"
      responses:
        "200":
          description: Productos encontrados correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuscarProductoResponse"
              example:
                - producto_id: 19
                  nombre: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
                  precio: 299.99
                  costo: 280.00
                  stock: 130
                  fecha: "2025-09-26"
                  categoria: "CPU Cooler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/categorias:
    get:
      summary: Categorías
      description: Retorna la lista de categorías disponibles para los productos.
      tags:
        - Productos
      responses:
        "200":
          description: Categorías listadas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaDTO"
              example:
                - id: 1
                  nombre: "CPU Cooler"
                - id: 2
                  nombre: "Monitores"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Solicitud incorrecta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Datos inválidos en la solicitud"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Producto no encontrado"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "Error interno"

  schemas:
    PageProductoListDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductoListDTO"
        totalElements:
          type: integer
          example: 1
        totalPages:
          type: integer
          example: 1
        size:
          type: integer
          example: 50
        number:
          type: integer
          example: 0

    ProductoListDTO:
      type: object
      properties:
        id:
          type: integer
          example: 19
        nombre:
          type: string
          example: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
        precio:
          type: number
          format: double
          example: 299.99
        marca:
          type: string
          example: "ASUS"
        imagenId:
          type: integer
          example: 10
        mimeType:
          type: string
          example: "image/png"

    ProductoDetalleDTO:
      type: object
      properties:
        id:
          type: integer
          example: 5
        nombre:
          type: string
          example: "Procesador Ryzen 5 5600G"
        precio:
          type: number
          format: double
          example: 145.99
        marca:
          type: string
          example: "AMD"
        imagenId:
          type: integer
          example: 10
        mimeType:
          type: string
          example: "image/png"
        galeria:
          type: array
          items:
            $ref: "#/components/schemas/GaleriaItemDTO"

    GaleriaItemDTO:
      type: object
      properties:
        galeriaId:
          type: integer
          example: 1
        mimeType:
          type: string
          example: "image/png"
        esPortada:
          type: boolean
          example: true
        posicionGaleria:
          type: integer
          example: 1

    ProductoCategoriaItemDTO:
      type: object
      properties:
        id:
          type: integer
          example: 19
        nombre:
          type: string
          example: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
        precio:
          type: number
          format: double
          example: 299.99
        marca:
          type: string
          example: "ASUS"
        imagenId:
          type: integer
          example: 10
        mimeType:
          type: string
          example: "image/png"

    BuscarProductoRequest:
      type: object
      required:
        - texto
      properties:
        texto:
          type: string
          example: "asus"

    BuscarProductoResponse:
      type: object
      properties:
        producto_id:
          type: integer
          example: 19
        nombre:
          type: string
          example: "ASUS Enfriador líquido ROG Strix LC III 360 ARGB LCD"
        precio:
          type: number
          format: double
          example: 299.99
        costo:
          type: number
          format: double
          example: 280.00
        stock:
          type: integer
          example: 130
        fecha:
          type: string
          format: date
          example: "2025-09-26"
        categoria:
          type: string
          example: "CPU Cooler"

    CategoriaDTO:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "CPU Cooler"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Error interno"