<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenid@ de nuevo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/auth-menu.js?v=8" defer></script>
    <script src="/js/role-utils.js" defer></script>
    <script src="/js/login.js?v=8" defer></script>


</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="floating-element"></div>
            <div class="floating-element"></div>
            <div class="floating-element"></div>
        </div>
        
        <div class="right-section">
            <div class="login-container">
                <h1 class="welcome-text">Bienvenid@ de nuevo</h1>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <input type="text" id="usuario" class="form-input" placeholder="Ingresa tu usuario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" class="form-input" placeholder="Ingresa tu contraseña" required>
                    </div>
                    
                    <button type="submit" class="login-button">Entrar</button>
                    <div style="clear: both;"></div>
                    
                </form>
                
                <div class="footer-links">
                    <div class="create-account">

                        <a href="CrearUsuario.html">Crea tu cuenta</a>
                    </div>
                    <div>
                        <a href="Recuperacion.html">¿Has olvidado la contraseña?</a>
                    </div>
                </div>
            </div>
            <!-- Sección para el segundo factor (MFA) -->
            <div id="mfaSection" style="display: none;">
                <h2>Verificación de Seguridad</h2>
                <p>Hemos enviado un código a tu correo <span id="mfaEmailMask"></span></p>
                <form id="mfaForm">
                    <input type="text" id="mfaCode" placeholder="Código de 6 dígitos" required maxlength="6">
                    <button type="submit">Verificar Código</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        // Función para mostrar mensajes
        function showMessage(message, type) {
            // Remover mensaje anterior si existe
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }

            // Crear nuevo mensaje
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease;
                ${type === 'success' ? 'background: #4CAF50;' : 'background: #dc3545;'}
            `;

            document.body.appendChild(messageDiv);

            // Remover después de 4 segundos
            setTimeout(() => {
                messageDiv.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => messageDiv.remove(), 300);
            }, 4000);
        }

        // Agregar estilos para animaciones de mensajes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        function showAlert(message) {
            alert(message);
        }

        // Efecto de partículas en el fondo
        function createParticle() {
            const leftSection = document.querySelector('.left-section');
            const particle = document.createElement('div');
            
            particle.style.position = 'absolute';
            particle.style.width = Math.random() * 4 + 2 + 'px';
            particle.style.height = particle.style.width;
            particle.style.background = 'rgba(255, 255, 255, 0.1)';
            particle.style.borderRadius = '50%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = '100%';
            particle.style.pointerEvents = 'none';
            
            leftSection.appendChild(particle);
            
            // Animación de la partícula
            let position = 100;
            const speed = Math.random() * 2 + 1;
            
            const animateParticle = () => {
                position -= speed;
                particle.style.top = position + '%';
                
                if (position > -10) {
                    requestAnimationFrame(animateParticle);
                } else {
                    particle.remove();
                }
            };
            
            animateParticle();
        }

        // Crear partículas cada 3 segundos
        setInterval(createParticle, 3000);

        // Efectos de hover en los inputs
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.style.transform = 'translateY(-2px)';
            });
            
            input.addEventListener('blur', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
