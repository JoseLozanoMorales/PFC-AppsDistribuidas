<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de búsqueda - TiendaTech</title>
  <!-- <link rel="stylesheet" href="style2.css"> -->
  <script src="/js/auth-menu.js?v=4" defer></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* Botón de carrito flotante dentro de cada card */
    .add-cart-btn{
      position:absolute; right:14px; top:14px;
      border-radius:12px;
      width:38px; height:38px; padding:0;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 10px rgba(0,0,0,.15);
    }
    .add-cart-btn i{ font-size:1.1rem; line-height:1; }
    .product-card{ position:relative; } /* por si tu CSS no lo tiene */
    /* Mini aviso */
    #snack{
      position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
      background:#1b5e20; color:#fff; padding:10px 16px; border-radius:8px;
      box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none;
      transition:opacity .25s ease;
      z-index: 9999;
    }
    #snack.show{ opacity:1; }
  </style>

  <link id="themeStylesheet" rel="stylesheet"
        href="css/styleClaroMenu.css" data-light="css/styleClaroMenu.css"
        data-dark="css/styleOscuroMenu.css" />

</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">TiendaTech</div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-bar" placeholder="Buscar...">
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <!-- Modo oscuro -->
    <button id="themeToggle" class="theme-toggle"
            type="button" aria-pressed="false">
      <span class="ico">🌙</span><span class="txt">Oscuro</span>
    </button>
  </header>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- Menú Hamburguesa -->
  <nav class="hamburger-menu" id="hamburgerMenu">
    <button class="menu-close" onclick="closeMenu()">✕</button>
    <a href="index.html" class="menu-item">Inicio</a>
    <a href="cuenta.html" class="menu-item">Cuenta</a>
    <a href="Carrito.html" class="menu-item">Carrito</a>
    <a href="#" class="menu-item">Cerrar sesión</a>
  </nav>

  <!-- Results -->
  <div class="results-container">
    <div class="results-title" id="resultsTitle">Resultados de la búsqueda</div>
    <div id="resultsContainer"></div>
    <div class="no-results d-none" id="noResults"><p>No se encontraron productos.</p></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html">Inicio</a>
      <a href="cuenta.html">Cuenta</a>
      <a href="Carrito.html">Carrito</a>
    </nav>
  </footer>

  <!-- Snack -->
  <div id="snack">Producto añadido al carrito</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script>
  (function () {
    const REDIRECT_TO = 'login.html';

    const menu = document.getElementById('hamburgerMenu');
    if (!menu) return;

    function hasActiveSession(){
      const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
      let ok = false;
      try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
      return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
    }

    function getLogoutLink(){
      return Array.from(menu.querySelectorAll('a.menu-item'))
        .find(a => (a.textContent || '').trim().toLowerCase() === 'cerrar sesión');
    }

    function updateLogoutVisibility(){
      const a = getLogoutLink();
      if (!a) return;
      if (hasActiveSession()){
        a.classList.remove('logout-disabled');
        a.removeAttribute('aria-disabled');
        a.tabIndex = 0;
      } else {
        a.classList.add('logout-disabled');
        a.setAttribute('aria-disabled','true');
        a.tabIndex = -1;
      }
    }

    menu.addEventListener('click', async function (ev) {
      const a = ev.target.closest('a.menu-item');
      if (!a) return;
      const label = (a.textContent || '').trim().toLowerCase();
      if (label !== 'cerrar sesión') return;
      if (a.getAttribute('aria-disabled') === 'true' || a.classList.contains('logout-disabled')){
        ev.preventDefault(); return;
      }
      ev.preventDefault();
      try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
      sessionStorage.removeItem('user');
      localStorage.removeItem('user');
      localStorage.removeItem('token');
      localStorage.removeItem('refreshToken');
      try {
        document.cookie.split(';').forEach(c=>{
          document.cookie = c.replace(/^ +/,'')
            .replace(/=.*/,'=;expires=' + new Date(0).toUTCString() + ';path=/');
        });
      } catch {}
      try { closeMenu(); } catch {}
      window.location.href = REDIRECT_TO;
    });

    document.addEventListener('DOMContentLoaded', updateLogoutVisibility);
    window.addEventListener('storage', updateLogoutVisibility);
    document.addEventListener('visibilitychange', updateLogoutVisibility);
  })();
  </script>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.toggle('active');
      overlay.classList.toggle('active');
    }
    function closeMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.remove('active');
      overlay.classList.remove('active');
    }
  </script>

  <script>
      // ====== Búsqueda por categoría + botón de carrito (icono-only) ======
      (function(){
        const params     = new URLSearchParams(location.search);
        const catId      = params.get('cat');
        const catNombre  = params.get('nombre') ? decodeURIComponent(params.get('nombre')) : null;

        const titleEl    = document.getElementById('resultsTitle');
        const container  = document.getElementById('resultsContainer');
        const noResults  = document.getElementById('noResults');
        const searchBox  = document.getElementById('searchInput');
        const snack      = document.getElementById('snack');

        let current = [];

        if (catNombre) titleEl.textContent = `Categoría: ${catNombre}`;

        function money(x){
          const n = Number(x);
          return isFinite(n) ? `$${n.toFixed(2)}` : '';
        }

        function showSnack(){
          snack.classList.add('show');
          setTimeout(()=> snack.classList.remove('show'), 1600);
        }

        function hasActiveSessionCart(){
          const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
          let ok = false;
          try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
          return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
        }

        async function tryPost(url, body){
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
          });
        }

        // === Agregar al carrito ===
        window.addToCart = async function(ev, productoId){
          ev.stopPropagation();
          try{
            if (hasActiveSessionCart()){
              let res = await tryPost('/api/carrito/items', { productoId: Number(productoId), cantidad: 1 });
              if(!res.ok){
                res = await tryPost('/api/carrito/agregar', { productoId: Number(productoId), cantidad: 1 });
              }
              if(!res.ok) throw new Error('backend_error');
            } else {
              const key = 'cart';
              const cart = JSON.parse(localStorage.getItem(key) || '[]');
              const f = cart.find(x => String(x.productoId) === String(productoId));
              if (f) f.cantidad += 1; else cart.push({ productoId: Number(productoId), cantidad: 1 });
              localStorage.setItem(key, JSON.stringify(cart));
            }
            showSnack();
          } catch(e){
            console.error('No se pudo agregar al carrito', e);
            alert('No se pudo agregar al carrito. Inténtalo de nuevo.');
          }
        };

        // === Render cards con botón icono ===
        function render(list){
          if (!Array.isArray(list)) list = [];

          // 🔒 además de la BD, filtramos en front por seguridad
          list = list
            .map(p => ({
              id: p.id ?? p.productoId,
              nombre: p.nombre,
              precio: Number(p.precio ?? p.preciounitario ?? 0),
              marca: p.marca,
              imagenId: p.imagenId ?? p.imagen_id
            }))
            .filter(p => p.precio > 0);

          if (list.length === 0){
            container.classList.add('d-none');
            noResults.classList.remove('d-none');
            return;
          }
          container.classList.remove('d-none');
          noResults.classList.add('d-none');

          window.viewProduct = (id) => {
            location.href = `informacion_producto.html?id=${encodeURIComponent(id)}`;
          };

          container.innerHTML = list.map(p => {
            const imgSrc = p.imagenId
              ? `/api/galeria_v2/img/${p.imagenId}`           // 👈 endpoint correcto
              : '/img/placeholder.png';

            return `
              <div class="product-card" onclick="viewProduct(${p.id})">
                <img class="product-image"
                     src="${imgSrc}"
                     alt="${p.nombre}"
                     onerror="this.onerror=null;this.src='/img/placeholder.png'">
                <div class="product-details">
                  <div class="product-name">${p.nombre}</div>
                  <div class="product-price">${money(p.precio)}</div>
                  <div class="product-brand">${p.marca || ''}</div>
                </div>
                <button class="btn btn-primary add-cart-btn"
                        title="Agregar al carrito"
                        aria-label="Agregar al carrito"
                        onclick="addToCart(event, ${p.id})">
                  <i class="bi bi-cart-plus"></i>
                </button>
              </div>
            `;
          }).join('');
        }

        async function load(){
          try {
            // Puedes usar el nuevo endpoint o el que ya tenías:
            // const url = `/api/busqueda/categoria/${encodeURIComponent(catId || '')}`;
            const url = `/api/productos/por-categoria?categoriaId=${encodeURIComponent(catId || '')}`;
            const res = await fetch(url, { credentials:'include' });
            const data = await res.json();
            current = Array.isArray(data) ? data : (Array.isArray(data?.content) ? data.content : []);
            render(current);
          } catch (e){
            console.error(e);
            container.innerHTML = `<p class="text-danger">Error al cargar productos.</p>`;
          }
        }

        if (searchBox){
          searchBox.addEventListener('input', () => {
            const term = searchBox.value.trim().toLowerCase();
            const filtered = term === '' ? current :
              current.filter(p =>
                (p.nombre || '').toLowerCase().includes(term) ||
                (p.marca  || '').toLowerCase().includes(term)
              );
            render(filtered);
          });
        }

        document.addEventListener('DOMContentLoaded', load);
      })();
  </script>



  <script>
    (function(){
      const LINK_ID='themeStylesheet', STORAGE_KEY='tt-theme', BTN_ID='themeToggle';
      function setTheme(theme){
        const link=document.getElementById(LINK_ID); if(!link) return;
        const href = theme==='dark'
                ? (link.dataset.dark  || 'styleOscuroMenu.css')   // <-- aquí
                : (link.dataset.light || 'styleClaroMenu.css');
        if(link.getAttribute('href')!==href) link.setAttribute('href', href);
        localStorage.setItem(STORAGE_KEY, theme);
        const btn=document.getElementById(BTN_ID);
        if(btn){
          const dark=theme==='dark';
          btn.textContent = dark ? '☀️ Claro' : '🌙 Oscuro';
          btn.title       = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
          btn.setAttribute('aria-pressed', String(dark));
          btn.classList.toggle('btn-warning', dark);
          btn.classList.toggle('btn-secondary', !dark);
        }
      }
      function toggleTheme(){
        const current=localStorage.getItem(STORAGE_KEY)||'light';
        setTheme(current==='light' ? 'dark' : 'light');
      }
      document.addEventListener('DOMContentLoaded',()=>{
        document.getElementById(BTN_ID)?.addEventListener('click', toggleTheme);
        setTheme(localStorage.getItem(STORAGE_KEY)||'light');
      });
    })();
  </script>
</body>
</html>
