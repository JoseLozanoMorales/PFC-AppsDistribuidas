syntax = "proto3";

package tiendatech.reservas.v1;

option java_multiple_files = true;
option java_package = "com.tiendatech.contracts.reservas.v1";
option java_outer_classname = "StockReservationProto";

service StockReservationService {
  rpc ReconcileReservation (ReservationRequest) returns (ReservationResponse);
}

message ReservationRequest {
  int64 cart_id = 1;
  int64 user_id = 2;
  int64 product_id = 3;
  int32 quantity = 4;
  int64 lamport_timestamp = 5;
  string device_id = 6;
  string operation_id = 7;
}

message ReservationResponse {
  bool accepted = 1;
  string message = 2;
  int32 reserved_quantity = 3;
  int32 available_stock = 4;
  int64 lamport_timestamp = 5;
  string winning_device_id = 6;
  bool replayed = 7;
}
