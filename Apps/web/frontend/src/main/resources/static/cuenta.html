<body>

    <div class="search-container">

    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Información Personal -->
    <div class="container">
      <div class="container-header">Información Personal</div>
      <div class="container-content">
        <div class="profile-section">
          <div>
            <!-- <div class="profile-avatar">JD</div>
            <div class="avatar-label">Foto de perfil</div> -->
            <div class="avatar-wrap">
              <img id="avatar" src="/assets/avatars/defaults/user.png" alt="Foto de perfil">

            </div>
          </div>
          <div class="profile-form">
            <div class="form-group">
              <label class="form-label">Nombre</label>
              <input type="text" name="nombre" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Usuario</label>
              <input type="text" name="usuario" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Número de teléfono</label>
              <input type="tel" name="telefono" class="form-input" readonly/>
            </div>
            <div class="form-group">
              <label class="form-label">Cédula</label>
              <input type="text" name="cedula" class="form-input" readonly/>
            </div>
            <div class="form-group full-width">
              <label class="form-label">Correo</label>
              <input type="email" name="correo" class="form-input" readonly/>
            </div>

    <!-- Métodos de Pago -->

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-nav">
      <a href="index.html" >Inicio</a>
      <a href="cuenta.html" class="active requires-auth">Cuenta</a>
      <a href="Carrito.html">Carrito</a>

  <!-- Modal: Agregar dirección -->

    </div>

  <!-- Script de sesión / logout del menú -->
  <script>
    (function () {
      const REDIRECT_TO = 'login.html';
      const menu = document.getElementById('hamburgerMenu');
      if (!menu) return;

      function hasActiveSession(){
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        let ok = false;
        try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
        return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
      }
      function getLogoutLink(){
        return Array.from(menu.querySelectorAll('a.menu-item'))
                .find(a => (a.textContent || '').trim().toLowerCase() === 'cerrar sesión');
      }
      function updateLogoutVisibility(){
        const a = getLogoutLink();
        if (!a) return;
        if (hasActiveSession()){
          a.classList.remove('logout-disabled'); a.removeAttribute('aria-disabled'); a.tabIndex = 0;
        } else {
          a.classList.add('logout-disabled'); a.setAttribute('aria-disabled','true'); a.tabIndex = -1;
        }
      }
      menu.addEventListener('click', async function (ev) {
        const a = ev.target.closest('a.menu-item'); if (!a) return;
        const label = (a.textContent || '').trim().toLowerCase();
        if (label !== 'cerrar sesión') return;
        if (a.getAttribute('aria-disabled') === 'true' || a.classList.contains('logout-disabled')){
          ev.preventDefault(); return;
        }
        ev.preventDefault();
        try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
        try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
        sessionStorage.removeItem('user'); localStorage.removeItem('user');
        localStorage.removeItem('token'); localStorage.removeItem('refreshToken');
        try { document.cookie.split(';').forEach(c=>{
          document.cookie = c.replace(/^ +/,'').replace(/=.*/,'=;expires=' + new Date(0).toUTCString() + ';path=/');
        }); } catch {}
        try { closeMenu(); } catch {}
        window.location.href = REDIRECT_TO;
      });
      document.addEventListener('DOMContentLoaded', updateLogoutVisibility);
      window.addEventListener('storage', updateLogoutVisibility);
      document.addEventListener('visibilitychange', updateLogoutVisibility);
    })();
  </script>

  <!-- Prefill de datos de usuario (desde sessionStorage) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const userJSON = sessionStorage.getItem('user');
      if (!userJSON) return;
      const user = JSON.parse(userJSON);
      document.querySelector('input[name="nombre"]').value   = user.nombre   || '';
      document.querySelector('input[name="usuario"]').value  = user.usuario  || '';
      document.querySelector('input[name="telefono"]').value = user.telefono || '';
      document.querySelector('input[name="cedula"]').value   = user.cedula   || '';
      document.querySelector('input[name="correo"]').value   = user.correo   || '';
    });
  </script>

  <!-- UI helpers (menú principal) -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.toggle('active'); overlay.classList.toggle('active');
    }
    function closeMenu() {
      const menu = document.getElementById('hamburgerMenu');
      const overlay = document.getElementById('overlay');
      menu.classList.remove('active'); overlay.classList.remove('active');
    }
  </script>

  <!-- DIRECCIONES + MODAL (solo ciudad) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- USER_ID desde sessionStorage (fallback 1)
      const USER_ID = (() => {
        try {
          const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
          if (!raw) return 1;
          const u = JSON.parse(raw);
          return u.usuarioId ?? u.id ?? u.userId ?? u.id_usuario ?? 1;
        } catch { return 1; }
      })();

      // --- Elementos
      const listEl  = document.getElementById('direcciones-container');
      const modalEl = document.getElementById('addressModal');
      const formEl  = document.getElementById('addressForm');
      const citySel = document.getElementById('addressCity');
      const inCalle = document.getElementById('addressStreet');
      const inRef   = document.getElementById('addressReference');

      // Oculta y des-activa el selector de provincia si existe en el markup
      (function hideProvinceBlock(){
        const provSel  = document.getElementById('addressProvince');
        const provWrap = provSel ? provSel.closest('.col-md-6') : null;
        if (provSel)  provSel.removeAttribute('required');
        if (provWrap) provWrap.style.display = 'none';
      })();

      // --- Estado
      let CIUDADES = [];     // [{ ciudadId, nombre }]
      let editingId = null;  // null = crear, number = editar

      // --- Helpers
      const esc = s => s ? s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])) : '';
      const option = (v,t) => `<option value="${v}">${t}</option>`;
      const setLoading = (sel,msg='Cargando...') => { if (sel) sel.innerHTML = option('', msg); };

      function cardHTML(d, n) {
        const ciudad = d.ciudadNombre || '';
        const provincia = d.provinciaNombre || '';
        const tituloUbic = (ciudad && provincia) ? `${ciudad}, ${provincia}` : (ciudad || provincia || 'Dirección');

        const dataAttrs = [
          `data-id="${d.direccionId}"`,
          `data-calle="${esc(d.calle || '')}"`,
          `data-referencia="${esc(d.referencia || '')}"`,
          `data-ciudadid="${d.ciudadId ?? ''}"`
        ].join(' ');

        return `
        <div class="col-12 col-md-6">
          <div class="address-card p-3 border rounded-3 h-100">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <strong>${esc(tituloUbic)}</strong>
              <span class="text-muted">#${n}</span>
            </div>
            <div class="mb-1">${esc(d.calle || '')}</div>
            ${d.referencia ? `<div class="text-muted small">${esc(d.referencia)}</div>` : ''}
            <div class="mt-2 d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" data-action="edit" ${dataAttrs}>
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${d.direccionId}">
                <i class="bi bi-trash"></i> Eliminar
              </button>
            </div>
          </div>
        </div>`;
      }

      // --- Listar direcciones (habilitadas según backend)
      async function loadUserAddresses() {
        if (!listEl) return;
        listEl.innerHTML = `<div class="col-12 text-center py-4 text-muted">Cargando direcciones…</div>`;
        try {
          const r = await fetch(`/api/usuarios/${USER_ID}/direcciones`);
          if (!r.ok) throw new Error(await r.text());
          const data = await r.json();

          // Si quieres asegurar “más nuevas primero”, descomenta:
          // data.sort((a,b) => (b.direccionId ?? 0) - (a.direccionId ?? 0));

          listEl.innerHTML = (!Array.isArray(data) || data.length === 0)
                  ? `<div class="col-12 text-center text-muted py-4">Aún no tienes direcciones guardadas.</div>`
                  : data.map((item, idx) => cardHTML(item, idx + 1)).join('');
        } catch (e) {
          console.error(e);
          listEl.innerHTML = `<div class="col-12 text-danger text-center py-4">No se pudieron cargar las direcciones.</div>`;
          notify('No se pudieron cargar las direcciones.', 'error');
        }
      }

      // --- Cargar todas las ciudades
      async function loadCities() {
        setLoading(citySel);
        try {
          const r = await fetch('/api/ciudades');
          if (!r.ok) throw new Error('No se pudo cargar ciudades');
          const arr = await r.json();
          CIUDADES = (Array.isArray(arr) ? arr : [])
                  .map(c => ({ ciudadId: c.ciudadId ?? c.id ?? c.ciudad_id, nombre: c.nombre || '' }))
                  .filter(c => c.ciudadId != null)
                  .sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
          citySel.innerHTML = option('', 'Seleccionar ciudad') +
                  CIUDADES.map(c => option(c.ciudadId, c.nombre)).join('');
        } catch (e) {
          console.error(e);
          citySel.innerHTML = option('', 'Error cargando ciudades');
        }
      }

      // --- Clicks en tarjetas (editar / eliminar)
      listEl?.addEventListener('click', async (ev) => {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');

        if (action === 'delete') {
          const id = btn.getAttribute('data-id');
          if (!id || !confirm('¿Eliminar esta dirección?')) return;
          try {
            const resp = await fetch(`/api/usuarios/${USER_ID}/direcciones/${id}`, { method: 'DELETE' });
            if (resp.status === 204) await loadUserAddresses();
            else throw new Error(`Error ${resp.status}: ${await resp.text()}`);
          } catch (err) {
            console.error(err);
            alert('No se pudo eliminar la dirección.');
          }
          return;
        }

        if (action === 'edit') {
          editingId     = Number(btn.getAttribute('data-id'));
          inCalle.value = btn.getAttribute('data-calle') || '';
          inRef.value   = btn.getAttribute('data-referencia') || '';
          const cid     = btn.getAttribute('data-ciudadid') || '';
          if (!CIUDADES.length) await loadCities();
          citySel.value = cid;
          (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl)).show();
        }
      });

      // --- Modal eventos
      modalEl?.addEventListener('show.bs.modal', async () => {
        if (!CIUDADES.length) await loadCities();
        if (editingId == null) { formEl.reset(); citySel.value=''; }
      });
      modalEl?.addEventListener('hidden.bs.modal', () => { editingId = null; formEl.reset(); });

      // --- Guardar (crear/editar)
      formEl?.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const payload = {
          calle:      inCalle.value.trim(),
          referencia: (inRef.value.trim() || null),
          ciudadId:   citySel.value ? Number(citySel.value) : null // backend lo mapea a Short
        };
        if (!payload.calle)    { notify('Calle es obligatoria.', 'error'); return; }
        if (!payload.ciudadId) { notify('Seleccione una ciudad.', 'error'); return; }

        /*try {
          if (editingId == null) {
            // CREAR
            const r = await fetch(`/api/usuarios/${USER_ID}/direcciones`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!r.ok) throw new Error(`Error ${r.status}: ${await r.text()}`);
          } else {
            // EDITAR
            const r = await fetch(`/api/usuarios/${USER_ID}/direcciones/${editingId}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (!r.ok) throw new Error(`Error ${r.status}: ${await r.text()}`);
          }
          (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl)).hide();
          await loadUserAddresses();
        } catch (e) {
          console.error('No se pudo guardar la dirección:', e);
          alert('No se pudo guardar la dirección.');
        }*/

        try {
          if (editingId == null) {
            // CREAR
            await fetchOrThrow(`/api/usuarios/${USER_ID}/direcciones`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            notify('Dirección agregada.', 'success');
          } else {
            // EDITAR
            await fetchOrThrow(`/api/usuarios/${USER_ID}/direcciones/${editingId}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            notify('Dirección actualizada.', 'success');
          }
          (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl)).hide();
          await loadUserAddresses();
        } catch (e) {
          console.error('No se pudo guardar la dirección:', e);
          // Mensajes más claros por estado (si usas fetchOrThrow tendrás e.status)
          if (e.status === 409) notify('Datos ya guardados: ya existe una dirección con esos datos.', 'error');
          else if (e.status === 422) notify('Datos inválidos. Verifique la información.', 'error');
          else notify(e.message || 'No se pudo guardar la dirección.', 'error');
        }
      });

      // --- Inicio
      loadCities().catch(()=>{});
      loadUserAddresses().catch(()=>{});
    });
  </script>



  <!-- Para cuando ya tenga foto de perfil -->
  <script>
    (function () {
      const DEFAULT = '/assets/avatars/defaults/user.png';
      const img = document.getElementById('avatar');
      if (!img) return;

      // fallback si la URL falla
      img.onerror = () => { img.onerror = null; img.src = DEFAULT; };

      // leer usuario de session/local storage
      function readUser() {
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        if (!raw) return null;
        try { return JSON.parse(raw); } catch { return null; }
      }
      function getId(u){
        return u?.usuarioId ?? u?.id ?? u?.userId ?? u?.id_usuario ?? u?.usuario_id ?? null;
      }
      function getAvatar(u){
        return (u?.avatar_path || u?.avatarPath || u?.avatarUrl || '').trim() || null;
      }
      async function fetchMe(){
        try {
          const r = await fetch('/api/usuarios/me');
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }
      async function fetchById(id){
        if (!id) return null;
        try {
          const r = await fetch(`/api/usuarios/${id}`);
          if (!r.ok) return null;
          return await r.json();
        } catch { return null; }
      }

      (async function init(){
        // 1) desde storage
        const u = readUser();
        const id = getId(u);
        const url1 = getAvatar(u);
        if (url1) { img.src = url1 + '?t=' + Date.now(); return; }

        // 2) desde /me
        const me = await fetchMe();
        const url2 = getAvatar(me);
        if (url2) { img.src = url2 + '?t=' + Date.now(); return; }

        // 3) desde /usuarios/{id} (si tenemos id)
        if (id) {
          const byId = await fetchById(id);
          const url3 = getAvatar(byId);
          if (url3) { img.src = url3 + '?t=' + Date.now(); return; }

          // 4) último intento: convención de ruta directa (por si la BD no trae avatar_path)
          img.src = `/uploads/avatars/${id}/avatar.png?t=` + Date.now();
          return;
        }

        // 5) default
        img.src = DEFAULT;
      })();
    })();
  </script>

  <!--  MÉTODOS DE PAGO: Lógica de UI-->
  <script>
    (function(){
      // --- USER_ID desde session/local storage
      const USER_ID = (()=>{
        try{
          const u = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || 'null');
          return u?.usuarioId ?? u?.id ?? u?.userId ?? u?.id_usuario ?? null;
        }catch{ return null; }
      })();

      // --- Endpoints backend (pedidos-service: MetodoPagoController -> /api/metodopago)
      const API = {
        tipos: '/api/metodopago/tipos',
        base:  '/api/metodopago'
      };

      // --- Elementos UI
      const listEl   = document.getElementById('mp-list');
      const toastEl  = document.getElementById('mp-feedback');

      const modalEl  = document.getElementById('paymentModal');
      const modal    = () => (bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl));

      const form     = document.getElementById('paymentForm');
      const inputNum = document.getElementById('cardNumber');
      const helpNum  = document.getElementById('cardHelp');
      const inputExp = document.getElementById('expiryDate'); // <input type="month"> -> "YYYY-MM"
      const selectTp = document.getElementById('paymentTipo');
      const wrapPref = document.getElementById('preferidoWrap');

      // Oculta el check de preferido (no hay endpoint para eso aún)
      if (wrapPref) wrapPref.style.display = 'none';

      // --- Helpers auth/headers
      function authHeaders(extra = {}){
        const token = localStorage.getItem('token');
        const h = { 'X-User-Id': USER_ID, ...extra };
        if (token) h['Authorization'] = `Bearer ${token}`;
        return h;
      }
      const withAuth = (opts={}) => ({
        credentials: 'include',
        ...opts,
        headers: authHeaders({ 'Content-Type':'application/json', ...(opts.headers||{}) })
      });

      // --- Helpers UI
      function showToast(msg){
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        setTimeout(()=> toastEl.style.display='none', 2000);
      }
      function toMMYYYY(s){
        if (!s) return null;
        // acepta "YYYY-MM" o "YYYY-MM-DD"
        if (/^\d{4}-\d{2}(-\d{2})?$/.test(s)) {
          const [y,m] = s.split('-');
          return `${m}/${y}`;
        }
        return s;
      }
      function luhnOk(num){
        num=(num||'').replace(/\s+/g,'');
        if (!/^\d{12,19}$/.test(num)) return false;
        let sum=0,d=false; for(let i=num.length-1;i>=0;i--){ let k=+num[i]; if(d){ k*=2; if(k>9)k-=9; } sum+=k; d=!d; }
        return sum%10===0;
      }
      function expFuture(yyyyMm){
        if (!yyyyMm) return false;
        const [y,m]=yyyyMm.split('-').map(Number);
        const now=new Date();
        const ymSel=y*100+m, ymNow=now.getFullYear()*100+(now.getMonth()+1);
        return ymSel>=ymNow;
      }

      // --- API calls
      async function loadTipos(){
        try{
          const r = await fetch(API.tipos, { credentials:'include' });
          const arr = await r.json();
          selectTp.innerHTML = '<option value="">Seleccionar</option>' + (arr||[])
                  .map(t => `<option value="${t.tipoId}">${t.nombre}</option>`).join('');
        }catch(e){
          console.error(e);
          selectTp.innerHTML = '<option value="">(error)</option>';
        }
      }

      async function apiList(){
        const r = await fetch(`${API.base}/usuario/${USER_ID}`, withAuth());
        if (!r.ok) throw new Error(await r.text());
        return await r.json(); // List<MetodoPago>: {metodopagoId, numeroMascara, fechaExpiracion, habilitado, tipoId, tipoNombre}
      }

      async function apiAdd(payload){
        const r = await fetch(API.base, withAuth({ method:'POST', body:JSON.stringify(payload) }));
        if (!r.ok) throw new Error(await r.text());
        return await apiList(); // el backend no devuelve la lista actualizada; la recargamos
      }

      async function apiDelete(id){
        const r = await fetch(`${API.base}/${id}?usuarioId=${USER_ID}`, withAuth({ method:'DELETE' }));
        if (!r.ok) throw new Error(await r.text()); // inactivar responde 200 vacío, no 204
      }

      // --- Render
      function card(it){
        const vence = toMMYYYY(it.fechaExpiracion);
        const tipo  = it.tipoNombre || '—';
        return `
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border rounded-3 h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="fw-semibold">${it.numeroMascara || '****'}</div>
              <div class="text-muted small">Vence: ${vence || '—'} · Tipo: ${tipo}</div>
              <div class="text-muted small">Estado: ${it.habilitado ? 'Habilitado' : 'Deshabilitado'}</div>
            </div>
            <button class="btn btn-sm btn-outline-danger" data-act="delete" data-id="${it.metodopagoId}" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>`;
      }

      function render(list){
        if (!list || list.length===0){
          listEl.innerHTML = `<div class="col-12 text-center text-muted py-4">Aún no tienes métodos de pago.</div>`;
          return;
        }
        listEl.innerHTML = list.map(card).join('');
      }

      // --- Formato del input de tarjeta (espaciado 4-4-4-4)
      inputNum?.addEventListener('input', function(){
        let value = this.value.replace(/\s/g,'').replace(/[^0-9]/g,'');
        let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
        if (formatted.length <= 19) this.value = formatted;
      });

      // --- Envío del formulario
      form?.addEventListener('submit', async (e)=>{
        e.preventDefault();

        const rawNum = inputNum.value.trim().replace(/\s+/g,'');
        const month  = inputExp.value; // "YYYY-MM"
        const tipoId = parseInt(selectTp.value,10) || null;

        if (!rawNum){ helpNum.textContent='Ingresa el número de tarjeta.'; helpNum.classList.add('text-danger'); return; }
        if (!luhnOk(rawNum)){ helpNum.textContent='Número inválido (Luhn).'; helpNum.classList.add('text-danger'); return; }
        helpNum.textContent='No se almacenan espacios'; helpNum.classList.remove('text-danger');

        if (!month || !/^\d{4}-\d{2}$/.test(month)){ alert('La fecha de expiración debe ser YYYY-MM.'); return; }
        if (!expFuture(month)){ alert('La fecha de expiración debe ser actual o futura.'); return; }

        if (!tipoId){ alert('Selecciona un tipo de tarjeta.'); return; }

        try{
          // El backend guarda fechaExpiracion como LocalDate (YYYY-MM-DD); usamos el día 1 del mes elegido.
          const payload = { numeroTarjeta: rawNum, fechaExpiracion: `${month}-01`, tipoId, usuarioId: USER_ID };
          const lista = await apiAdd(payload);
          render(lista);
          showToast('Método agregado.');
          modal().hide();
          form.reset();
        }catch(err){
          console.error(err);
          alert('No se pudo guardar el método de pago.');
        }
      });

      // --- Click en eliminar
      listEl?.addEventListener('click', async (ev)=>{
        const btn = ev.target.closest('button[data-act="delete"]'); if(!btn) return;
        const id = +btn.dataset.id; if(!id) return;
        if (!confirm('¿Eliminar este método de pago?')) return;
        try{
          await apiDelete(id);
          render(await apiList());
          showToast('Eliminado.');
        }catch(err){
          console.error(err);
          alert('No se pudo eliminar.');
        }
      });

      // --- Inicialización
      (async function init(){
        if (!USER_ID) console.warn('USER_ID no resuelto. Asegúrate de tener la sesión cargada.');
        await loadTipos().catch(()=>{});
        try { render(await apiList()); }
        catch { listEl.innerHTML = `<div class="col-12 text-danger text-center py-4">No se pudieron cargar los métodos de pago.</div>`; }
      })();

    })();
  </script>
    <script>
      (function(){
        const LINK_ID='themeStylesheet', STORAGE_KEY='tt-theme', BTN_ID='themeToggle';
        function setTheme(theme){
          const link=document.getElementById(LINK_ID); if(!link) return;
          const href = theme==='dark'
                  ? (link.dataset.dark  || 'styleOscuroMenu.css')   // <-- aquí
                  : (link.dataset.light || 'styleClaroMenu.css');
          if(link.getAttribute('href')!==href) link.setAttribute('href', href);
          localStorage.setItem(STORAGE_KEY, theme);
          const btn=document.getElementById(BTN_ID);
          if(btn){
            const dark=theme==='dark';
            btn.textContent = dark ? '☀️ Claro' : '🌙 Oscuro';
            btn.title       = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
            btn.setAttribute('aria-pressed', String(dark));
            btn.classList.toggle('btn-warning', dark);
            btn.classList.toggle('btn-secondary', !dark);
          }
        }
        function toggleTheme(){
          const current=localStorage.getItem(STORAGE_KEY)||'light';
          setTheme(current==='light' ? 'dark' : 'light');
        }
        document.addEventListener('DOMContentLoaded',()=>{
          document.getElementById(BTN_ID)?.addEventListener('click', toggleTheme);
          setTheme(localStorage.getItem(STORAGE_KEY)||'light');
        });
      })();
    </script>


  <script>
    // ====== NOTIFICADOR GLOBAL (top-right) ======
    (function () {
      const css = `
  .tt-toast{position:fixed;right:20px;top:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
  .tt-toast .item{min-width:260px;max-width:380px;padding:12px 14px;border-radius:10px;color:#fff;
                  box-shadow:0 10px 25px rgba(0,0,0,.18);opacity:0;transform:translateX(16px);
                  animation:tt-in .18s ease forwards}
  .tt-toast .success{background:#198754}.tt-toast .error{background:#dc3545}
  .tt-toast .info{background:#0d6efd}.tt-toast .warn{background:#fd7e14}
  @keyframes tt-in{to{opacity:1;transform:none}}
  @keyframes tt-out{to{opacity:0;transform:translateX(16px)}}
  `;
      const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
      const box = document.createElement('div'); box.className = 'tt-toast'; document.body.appendChild(box);

      // Uso: notify('mensaje','success'|'error'|'info'|'warn', milisegundos)
      window.notify = function (msg, type='info', ms=3500) {
        const el = document.createElement('div');
        el.className = `item ${type}`; el.textContent = msg; box.appendChild(el);
        setTimeout(() => { el.style.animation = 'tt-out .18s ease forwards';
          setTimeout(() => el.remove(), 200); }, ms);
      };

      // Helper para fetch con mensajes por estado (opcional, ver usos abajo)
      window.fetchOrThrow = async function (url, opts) {
        const r = await fetch(url, opts);
        if (!r.ok) {
          let serverMsg = '';
          try { const data = await r.json(); serverMsg = (data?.message || data?.error || '').trim(); } catch {}
          let msg = serverMsg || `Error ${r.status}`;
          if (r.status === 409 && !serverMsg) msg = 'Datos ya guardados / registro duplicado.';
          if (r.status >= 500 && !serverMsg) msg = 'Error en el servidor.';
          const err = new Error(msg); err.status = r.status; throw err;
        }
        return r;
      };
    })();
  </script>
