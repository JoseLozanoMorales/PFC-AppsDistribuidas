<!DOCTYPE html>

        .product-image-small img{

<script>
    (function () {
      const REDIRECT_TO = 'login.html'; // ajusta si tu login se llama distinto

      const menu = document.getElementById('hamburgerMenu');
      if (!menu) return;

      // ---- Detecta si hay sesión activa ----
      function hasActiveSession(){
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        let ok = false;
        try { ok = !!(raw && JSON.parse(raw)); } catch { ok = !!raw; }
        return ok || !!localStorage.getItem('token') || !!localStorage.getItem('refreshToken');
      }

      // ---- Busca el enlace "Cerrar sesión" y aplica estilo/estado ----
      function getLogoutLink(){
        return Array.from(menu.querySelectorAll('a.menu-item'))
          .find(a => (a.textContent || '').trim().toLowerCase() === 'cerrar sesión');
      }

      function updateLogoutVisibility(){
        const a = getLogoutLink();
        if (!a) return;
        if (hasActiveSession()){
          a.classList.remove('logout-disabled');
          a.removeAttribute('aria-disabled');
          a.tabIndex = 0;
        } else {
          a.classList.add('logout-disabled');
          a.setAttribute('aria-disabled','true');
          a.tabIndex = -1;
        }
      }

      // ---- Delegación de clicks dentro del menú ----
      menu.addEventListener('click', async function (ev) {
        const a = ev.target.closest('a.menu-item');
        if (!a) return;

        const label = (a.textContent || '').trim().toLowerCase();
        if (label !== 'cerrar sesión') return;

        // si está inactivo, no hace nada
        if (a.getAttribute('aria-disabled') === 'true' || a.classList.contains('logout-disabled')){
          ev.preventDefault();
          return;
        }

        ev.preventDefault();

        // (Opcional) notificar al backend
        try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
        try { await fetch('/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}

        // limpiar sesión local
        sessionStorage.removeItem('user');
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        localStorage.removeItem('refreshToken');

        // limpiar cookies no-HttpOnly (si las hubiera)
        try {
          document.cookie.split(';').forEach(c=>{
            document.cookie = c.replace(/^ +/,'')
              .replace(/=.*/,'=;expires=' + new Date(0).toUTCString() + ';path=/');
          });
        } catch {}

        try { closeMenu(); } catch {}
        window.location.href = REDIRECT_TO;
      });

      // Inicializa y mantén sincronizado si cambia el storage (otra pestaña)
      document.addEventListener('DOMContentLoaded', updateLogoutVisibility);
      window.addEventListener('storage', updateLogoutVisibility);
      // por si el panel se abre/cierra y quieres refrescar
      document.addEventListener('visibilitychange', updateLogoutVisibility);
    })();
</script>

<script>
    (function(){
      const listEl   = document.getElementById('cart-items');
      const emptyEl  = document.getElementById('empty-cart');
      const fmt      = n => `$${Number(n||0).toFixed(2)}`;
      let ITEMS = [];
      let CARRITO_ID = null;

      function getUsuarioId(){
        try{
          const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
          const u = raw ? JSON.parse(raw) : null;
          return u?.usuarioId ?? u?.usuario_id ?? u?.id ?? u?.UsuarioID ?? null;
        }catch{ return null; }
      }
      const USER_ID = getUsuarioId();

      async function fetchJSON(url, opt){
        const r = await fetch(url, Object.assign({credentials:'include'}, opt||{}));
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const ct = r.headers.get('content-type') || '';
        return ct.includes('application/json') ? r.json() : null;
      }

      // pedidos-service (CarritoController) requiere el carritoId, no hay ruta plana /items:
      // 1) GET /api/carrito/{usuarioId} resuelve/crea el carrito activo,
      // 2) GET /api/carrito/{carritoId}/detalle trae las líneas {productoId, cantidad, precioUnitario}.
      async function loadCart(){
        if (!USER_ID){
          listEl.innerHTML = '<p>No se pudo identificar al usuario. Inicia sesión de nuevo.</p>';
          return;
        }
        try{
          const carrito = await fetchJSON(`/api/carrito/${USER_ID}`);
          CARRITO_ID = carrito.carritoId;
          const respuesta = await fetchJSON(`/api/carrito/${CARRITO_ID}/detalle`);
          // pedidos-service pagina este endpoint: {content, page, size,
          // totalElements, totalPages} en vez de un array plano.
          if (Array.isArray(respuesta)) ITEMS = respuesta;
          else if (respuesta && Array.isArray(respuesta.content)) ITEMS = respuesta.content;
          else throw new Error('Respuesta inesperada del carrito (se esperaba una lista).');
          render(ITEMS);
          updateSummary(carrito);
        }catch(err){
          console.error('No se pudo cargar el carrito', err);
          listEl.innerHTML = '<p>Error al cargar el carrito.</p>';
        }
      }

        // ---------- helpers NUEVOS ----------
        function bestImgId(it){
            // planos
            const flat = it || {};
            const ids = [
                flat.imagenId, flat.imagen_id,
                flat.portadaId, flat.portada_id,
                flat.galeriaId, flat.galeria_id,
                flat.imgId, flat.id_imagen, flat.producto_galeria_id
            ].filter(Boolean);
            if (ids.length) return ids[0];

            // anidados comunes
            const nested = [
                flat.imagen?.id, flat.portada?.id, flat.galeria?.id,
                flat.producto?.imagenId, flat.producto?.imagen_id,
                flat.producto?.portadaId, flat.producto?.portada_id
            ].filter(Boolean);
            return nested[0];
        }
        function buildImgSrcFromId(id){
            return id ? `/api/galeria_v2/img/${id}` : '/assets/placeholder.svg';
        }
        async function fetchProductAny(id){
            const tries = [
                `/api/productos/${id}`,
                `/api/productos/por-id?id=${id}`,
                `/api/busqueda/detalle/${id}`
            ];
            for (const url of tries){
                try{
                    const r = await fetch(url, { credentials:'include' });
                    if (r.ok) return await r.json();
                }catch{}
            }
            return null;
        }
        async function hydrateItemImage(pid, it, imgEl){
            // 1) si el item ya trae imagen
            const direct = bestImgId(it);
            if (direct){
                imgEl.src = buildImgSrcFromId(direct);
                return;
            }
            // 2) buscar detalle del producto y tomar su imagen
            const d = await fetchProductAny(pid);
            const id = bestImgId(d);
            imgEl.src = buildImgSrcFromId(id);
        }

        // CarritoDetalle (pedidos-service) solo trae {productoId, cantidad, precioUnitario} --
        // el nombre y el % de IVA no vienen del carrito, se buscan en productos-service.
        function bestNombre(p){
            return p?.nombre ?? p?.producto?.nombre ?? null;
        }
        function bestIvaPct(p){
            const flat = p || {};
            const vals = [
                flat.iva_porcentaje, flat.ivaPorcentaje, flat.porcentaje_iva, flat.porcentajeIva,
                flat.iva, flat.iva_pct,
                flat.producto?.iva_porcentaje, flat.producto?.ivaPorcentaje
            ].filter(v => v !== undefined && v !== null);
            return vals.length ? Number(vals[0]) : 0;
        }
        async function hydrateItemInfo(pid, row){
            const d = await fetchProductAny(pid);
            if (!d) return;
            const nombre = bestNombre(d);
            const ivaPct = bestIvaPct(d);
            const precio = Number(row.dataset.precio || 0);
            const nameEl = row.querySelector('.item-nombre');
            const ivaEl  = row.querySelector('.item-iva');
            const totalEl = row.querySelector('.item-total-con-iva');
            if (nameEl && nombre) nameEl.textContent = nombre;
            if (ivaEl) ivaEl.textContent = `IVA: ${ivaPct.toFixed(2)}%`;
            if (totalEl) totalEl.textContent = fmt(precio * (1 + ivaPct/100));
        }

        // ---------- REEMPLAZA SOLO ESTA FUNCIÓN render(items) ----------
        function render(items){
            listEl.innerHTML = '';
            if (!items || items.length === 0){
                listEl.style.display = 'none';
                emptyEl.style.display = 'block';
                return;
            }
            listEl.style.display = '';
            emptyEl.style.display = 'none';

            items.forEach(it=>{
                const row = document.createElement('div');
                row.className = 'cart-item';
                const pid = it.productoId;
                const precio = Number(it.precioUnitario||0);
                row.dataset.pid = pid;
                row.dataset.precio = precio;

                row.innerHTML = `
      <div class="row align-items-center">
        <div class="col-3 col-md-2">
          <div class="product-image-small">
            <img alt="Producto" data-pid="${pid}">
          </div>
        </div>
        <div class="col-6 col-md-5">
            <h6 class="mb-1 item-nombre">Producto #${pid}</h6>
            <small class="text-muted d-block item-iva">IVA: —</small>
            <small class="text-muted">Precio sin IVA: $${precio.toFixed(2)}</small>
        </div>
        <div class="col-3 col-md-2">
          <div class="quantity-controls">
            <div class="quantity-btn btn-minus"><i class="bi bi-dash"></i></div>
            <input type="number" class="quantity-input" min="1" value="${it.cantidad}">
            <div class="quantity-btn btn-plus"><i class="bi bi-plus"></i></div>
          </div>
        </div>
        <div class="col-6 col-md-2 mt-2 mt-md-0">
          <div class="fw-bold item-total-con-iva">$${precio.toFixed(2)}</div>
        </div>
        <div class="col-6 col-md-1 mt-2 mt-md-0 text-end">
          <i class="bi bi-trash remove-btn"></i>
        </div>
      </div>
    `;

                // wire qty / remove
                const qtyInput = row.querySelector('.quantity-input');
                row.querySelector('.btn-minus').onclick = () =>
                    setQty(pid, Math.max(1, Number(qtyInput.value)-1));
                row.querySelector('.btn-plus').onclick  = () =>
                    setQty(pid, Number(qtyInput.value)+1);
                qtyInput.onchange = () =>
                    setQty(pid, Math.max(1, Number(qtyInput.value)||1));
                row.querySelector('.remove-btn').onclick = () => removeItem(pid);

                // imagen y datos (nombre/IVA) del producto: placeholder inmediato + carga real desde productos-service
                const imgEl = row.querySelector('img[data-pid]');
                imgEl.src = '/assets/placeholder.svg';
                imgEl.addEventListener('error', ()=> { imgEl.src = '/assets/placeholder.svg'; });
                hydrateItemImage(pid, it, imgEl);
                hydrateItemInfo(pid, row);

                listEl.appendChild(row);
            });
        }
      /*function render(items){
        listEl.innerHTML = '';
        if (!items || items.length === 0){
          listEl.style.display = 'none';
          emptyEl.style.display = 'block';
          return;
        }
        listEl.style.display = '';
        emptyEl.style.display = 'none';

        items.forEach(it=>{
          const row = document.createElement('div');
          row.className = 'cart-item';
          row.dataset.pid = it.producto_id;

                </div>
              </div>
              <div class="col-6 col-md-2 mt-2 mt-md-0">
                <div class="fw-bold">${fmt(it.precio_con_iva ?? (it.precio*(1+(it.iva_porcentaje||0)/100)))}</div>
              </div>
              <div class="col-6 col-md-1 mt-2 mt-md-0 text-end">
                <i class="bi bi-trash remove-btn"></i>
              </div>
            </div>
          `;

          const qtyInput = row.querySelector('.quantity-input');
          row.querySelector('.btn-minus').onclick = () =>
            setQty(it.producto_id, Math.max(1, Number(qtyInput.value)-1));
          row.querySelector('.btn-plus').onclick  = () =>

          listEl.appendChild(row);
        });
      }*/

      // pedidos-service: PUT /{carritoId}/actualizar/{productoId} setea la cantidad exacta
      // (si llega a 0 o menos, el backend elimina el producto del carrito).
      async function setQty(productoId, cantidad){
        await fetchJSON(`/api/carrito/${CARRITO_ID}/actualizar/${encodeURIComponent(productoId)}`, {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({cantidad})
        });
        await loadCart();
      }

      async function removeItem(productoId){
        if (!confirm('¿Eliminar este producto del carrito?')) return;
        await fetchJSON(`/api/carrito/${CARRITO_ID}/quitar/${encodeURIComponent(productoId)}`, { method:'DELETE' });
        await loadCart();
      }

      // No existe endpoint de resumen con desglose de impuestos: el subtotal se calcula
      // sumando cantidad*precioUnitario de cada línea, y el impuesto se deriva restando
      // ese subtotal del `total` autoritativo que ya calcula el trigger de BD (incluye IVA),
      // para que subtotal + impuestos siempre cuadre exacto con el total real.
      function updateSummary(carrito){
        const tot = Number(carrito?.total || 0);
        const sub = (ITEMS||[]).reduce((acc,it)=> acc + Number(it.cantidad||0)*Number(it.precioUnitario||0), 0);
        const imp = Math.max(0, tot - sub);

        const count = (ITEMS||[]).reduce((acc,it)=>acc + Number(it.cantidad||0), 0);
        const subtotalLabel = document.getElementById('subtotal').parentElement.querySelector('span:first-child');
        subtotalLabel.textContent = `Subtotal (${count} producto${count===1?'':'s'}):`;

        document.getElementById('subtotal').textContent  = fmt(sub);
        document.getElementById('taxes').textContent     = fmt(imp);
        document.getElementById('total').textContent     = fmt(tot);
      }

      document.addEventListener('DOMContentLoaded', loadCart);
    })();
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
    try {
        const raw = sessionStorage.getItem('user') || localStorage.getItem('user');
        const u = raw ? JSON.parse(raw) : null;
        if (!u) {
        const next = encodeURIComponent(location.pathname + location.search);
        location.href = '/Login.html?next=' + next;
        }
    } catch {
        const next = encodeURIComponent(location.pathname + location.search);
        location.href = '/Login.html?next=' + next;
    }
    });
</script>

<script>
    (function(){
        const LINK_ID='themeStylesheet', STORAGE_KEY='tt-theme', BTN_ID='themeToggle';
        function setTheme(theme){
            const link=document.getElementById(LINK_ID); if(!link) return;
            const href = theme==='dark'
                ? (link.dataset.dark  || 'styleOscuroMenu.css')   // <-- aquí
                : (link.dataset.light || 'styleClaroMenu.css');
            if(link.getAttribute('href')!==href) link.setAttribute('href', href);
            localStorage.setItem(STORAGE_KEY, theme);
            const btn=document.getElementById(BTN_ID);
            if(btn){
                const dark=theme==='dark';
                btn.textContent = dark ? '☀️ Claro' : '🌙 Oscuro';
                btn.title       = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
                btn.setAttribute('aria-pressed', String(dark));
                btn.classList.toggle('btn-warning', dark);
                btn.classList.toggle('btn-secondary', !dark);
            }
        }
        function toggleTheme(){
            const current=localStorage.getItem(STORAGE_KEY)||'light';
            setTheme(current==='light' ? 'dark' : 'light');
        }
        document.addEventListener('DOMContentLoaded',()=>{
            document.getElementById(BTN_ID)?.addEventListener('click', toggleTheme);
            setTheme(localStorage.getItem(STORAGE_KEY)||'light');
        });
    })();
</script>

<script>
    function continueShopping() {
      location.href = 'index.html';
    }
</script>
