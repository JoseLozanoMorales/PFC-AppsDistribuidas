server:
  port: ${SERVER_PORT:8080}

tiendatech:
  security:
    jwt:
      # Debe ser el mismo AUTH_JWT_SECRET usado por usuarios-service para firmar tokens.
      secret: ${AUTH_JWT_SECRET:TiendaTechDistribuidaJwtSecretKey2026Seguro}
      # Rutas publicas del dominio usuarios: autenticacion, registro, OTP,
      # recuperacion de clave, catalogos geograficos y recursos estaticos.
      public-paths:
        - /api/login
        - /auth/**
        - /api/otp/**
        - /api/usuarios/crear
        - /api/usuarios/recuperar-password
        - /api/provincias/**
        - /api/ciudades/**
        - /uploads/**
        - /assets/**
        - /favicon.ico
      # Solo las lecturas del catalogo son publicas. Las escrituras sobre las
      # mismas rutas quedan protegidas por /api/**.
      public-read-paths:
        - /api/categorias/**
        - /api/marcas/**
        - /api/gamas/**
        - /api/galeria/**
        - /api/galeria_v2/**
        - /api/productos/**
        - /api/provincias/**
        - /api/ciudades/**
      protected-paths:
        - /api/**

spring:
  application:
    name: frontend

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios-auth
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/auth/**

            - id: usuarios-uploads
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/uploads/**

            - id: usuarios-api
              uri: ${USUARIOS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/login,/api/usuarios/**,/api/otp/**,/api/seguridad/**,/api/provincias/**,/api/ciudades/**,/api/auditoria/**

            - id: productos-api
              uri: ${PRODUCTOS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/categorias,/api/marcas,/api/gamas,/api/galeria/**,/api/galeria_v2/**,/api/productos/**,/api/sp/almacenamientos,/api/sp/cpu,/api/sp/cpu-cooler,/api/sp/cubiertas,/api/sp/fuentes,/api/sp/gpu,/api/sp/ram,/api/sp/motherboards,/api/sp/perifericos,/api/sp/accesorios,/api/sp/productos/**,/api/sp/ivas

            - id: inventario-api
              uri: ${INVENTARIO_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/movimientos,/api/subtipos-movimiento,/api/sp/movimiento-inventario

            - id: pedidos-api
              uri: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/carrito/**,/api/ordenes/**,/api/metodopago/**

            - id: ordenes-proveedores-api
              uri: ${ORDENES_PROVEEDORES_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/proveedores/**,/api/ordenes-compra/**

            - id: ventas-api
              uri: ${VENTAS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/facturas/**
