spring.application.name=ordenes-proveedores-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${TT_DATASOURCE_URL}
spring.datasource.username=${TT_DATASOURCE_USERNAME}
spring.datasource.password=${TT_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
logging.level.org.springframework=INFO

inventario.service.base-url=${INVENTARIO_SERVICE_URL:http://localhost:8082}
inventario.service.connect-timeout-ms=3000
inventario.service.read-timeout-ms=5000

#logging.level.com.zaxxer.hikari=DEBUG

auth.jwt.secret=${AUTH_JWT_SECRET}