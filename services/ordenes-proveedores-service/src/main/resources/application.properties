spring.application.name=ordenes-proveedores-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${CRDB_DATASOURCE_URL:jdbc:postgresql://crdb-1:26257,crdb-2:26257,crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}
spring.datasource.username=${CRDB_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRDB_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
logging.level.org.springframework=INFO

inventario.service.base-url=${INVENTARIO_SERVICE_URL:http://localhost:8082}
inventario.service.connect-timeout-ms=3000
inventario.service.read-timeout-ms=5000

#logging.level.com.zaxxer.hikari=DEBUG

resilience4j.circuitbreaker.instances.inventario.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventario.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventario.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventario.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventario.automatic-transition-from-open-to-half-open-enabled=true
# Un 4xx (400/404/409) de inventario-service es un rechazo de negocio deterministico
# (ej. el CHECK precio>=costo, producto inexistente, cantidad invalida): reintentarlo no
# lo va a arreglar, y contarlo como fallo de disponibilidad dispara el circuit breaker por
# error de datos, no por caida real del servicio. Solo 5xx/timeouts cuentan como fallo.
resilience4j.circuitbreaker.instances.inventario.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.inventario.max-attempts=3
resilience4j.retry.instances.inventario.wait-duration=500ms
resilience4j.retry.instances.inventario.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
