spring.application.name=inventario-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${CRDB_DATASOURCE_URL:jdbc:postgresql://crdb-1:26257,crdb-2:26257,crdb-3:26257/tiendatech?sslmode=disable&targetServerType=any&loadBalanceHosts=true}
spring.datasource.username=${CRDB_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRDB_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_SERIALIZABLE

spring.sql.init.mode=never
logging.level.org.springframework=INFO

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
