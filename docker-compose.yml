services:
  pedidos-crdb-service:
    build:
      context: services/pedidos-service
    container_name: pedidos-crdb-service
    environment:
      PEDIDOS_IDEMPOTENCIA_ENABLED: "true"
      SERVER_PORT: 8083
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      CRDB_RETRY_MAX_ATTEMPTS: 3
      CRDB_RETRY_DELAY_MS: 100
      VENTAS_SERVICE_URL: http://ventas-crdb-service:8086
      PRODUCTOS_SERVICE_URL: http://productos-crdb-service:8081
      USUARIOS_SERVICE_URL: http://usuarios-crdb-service:8085
    depends_on:
      ventas-crdb-service:
        condition: service_started
      productos-crdb-service:
        condition: service_started
      usuarios-crdb-service:
        condition: service_started
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  productos-crdb-service:
    build:
      context: services/productos-service
    container_name: productos-crdb-service
    environment:
      SERVER_PORT: 8081
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro

  # armado-ia-service: sin datasource propio (servicio de calculo puro sobre
  # el catalogo de productos-crdb-service via HTTP, no persiste nada). Las
  # credenciales de AWS NUNCA van literales aqui: se pasan desde el .env del
  # host via ${VAR}; si faltan, el servicio sigue funcionando con el
  # fallback deterministico de explicacion (ver ExplicacionService).
  armado-ia-service:
    build:
      context: services/armado-ia
    container_name: armado-ia-service
    environment:
      SERVER_PORT: 8087
      PRODUCTOS_SERVICE_URL: http://productos-crdb-service:8081
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    depends_on:
      productos-crdb-service:
        condition: service_started
    networks:
      - default
      - pfc-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  inventario-crdb-service:
    build:
      context: services/inventario-service
    container_name: inventario-crdb-service
    environment:
      SERVER_PORT: 8082
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro

  ventas-crdb-service:
    build:
      context: services/ventas-service
    container_name: ventas-crdb-service
    environment:
      SERVER_PORT: 8086
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      INVENTARIO_SERVICE_URL: http://inventario-crdb-service:8082
    depends_on:
      inventario-crdb-service:
        condition: service_started
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro

  ordenes-proveedores-crdb-service:
    build:
      context: services/ordenes-proveedores-service
    container_name: ordenes-proveedores-crdb-service
    environment:
      SERVER_PORT: 8084
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      INVENTARIO_SERVICE_URL: http://inventario-crdb-service:8082
    depends_on:
      inventario-crdb-service:
        condition: service_started
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro

  usuarios-crdb-service:
    build:
      context: services/usuarios
    container_name: usuarios-crdb-service
    environment:
      SERVER_PORT: 8085
      CRDB_DATASOURCE_URL: "${CRDB_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:26257,host.docker.internal:26258,host.docker.internal:26259/tiendatech?sslmode=verify-ca&sslrootcert=/app/crdb-certs/ca.crt&sslcert=/app/crdb-certs/client.jhinson.crt&sslkey=/app/crdb-certs/client.jhinson.key.pk8&targetServerType=any&loadBalanceHosts=true}"
      CRDB_DATASOURCE_USERNAME: ${CRDB_DATASOURCE_USERNAME:-root}
      CRDB_DATASOURCE_PASSWORD: ${CRDB_DATASOURCE_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
      TT_MAIL_USERNAME: ${TT_MAIL_USERNAME:-}
      TT_MAIL_PASSWORD: ${TT_MAIL_PASSWORD:-}
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${MAIL_READ_TIMEOUT_MS:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      COOKIE_SECURE: "false"
      OTP_MAIL_FALLBACK_ENABLED: ${OTP_MAIL_FALLBACK_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - default
      - pfc-net
    volumes:
      - ./Apps/web/infra/crdb-certs/ca.crt:/app/crdb-certs/ca.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.crt:/app/crdb-certs/client.jhinson.crt:ro
      - ./Apps/web/infra/crdb-certs/client.jhinson.key.pk8:/app/crdb-certs/client.jhinson.key.pk8:ro

  frontend-crdb:
    build:
      context: Apps/web/frontend
    container_name: frontend-crdb
    ports:
      - "0.0.0.0:8180:8080"
    environment:
      SERVER_PORT: 8080
      USUARIOS_SERVICE_URL: http://usuarios-crdb-service:8085
      PRODUCTOS_SERVICE_URL: http://productos-crdb-service:8081
      INVENTARIO_SERVICE_URL: http://inventario-crdb-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-crdb-service:8083
      ORDENES_PROVEEDORES_SERVICE_URL: http://ordenes-proveedores-crdb-service:8084
      VENTAS_SERVICE_URL: http://ventas-crdb-service:8086
      ARMADO_IA_SERVICE_URL: http://armado-ia-service:8087
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-TiendaTechDistribuidaJwtSecretKey2026Seguro}
    depends_on:
      usuarios-crdb-service:
        condition: service_started
      productos-crdb-service:
        condition: service_started
      inventario-crdb-service:
        condition: service_started
      pedidos-crdb-service:
        condition: service_started
      ordenes-proveedores-crdb-service:
        condition: service_started
      ventas-crdb-service:
        condition: service_started
      armado-ia-service:
        condition: service_started
    networks:
      - default
      - pfc-net

networks:
  pfc-net:
    driver: bridge
