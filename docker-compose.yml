services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      USUARIOS_SERVICE_URL: http://usuarios-service:8085
      PRODUCTOS_SERVICE_URL: http://productos-service:8081
      INVENTARIO_SERVICE_URL: http://inventario-service:8082
      PEDIDOS_SERVICE_URL: http://pedidos-service:8083
      ORDENES_PROVEEDORES_SERVICE_URL: http://ordenes-proveedores-service:8084
      VENTAS_SERVICE_URL: http://ventas-service:8086
    depends_on:
      - usuarios-service
      - productos-service
      - inventario-service
      - pedidos-service
      - ordenes-proveedores-service
      - ventas-service

  productos-service:
    build:
      context: ./productos-service
    container_name: productos-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}

  inventario-service:
    build:
      context: ./inventario-service
    container_name: inventario-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}

  pedidos-service:
    build:
      context: ./pedidos-service
    container_name: pedidos-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}
      VENTAS_SERVICE_URL: http://ventas-service:8086
      PRODUCTOS_SERVICE_URL: http://productos-service:8081
      USUARIOS_SERVICE_URL: http://usuarios-service:8085


  ordenes-proveedores-service:
    build:
      context: ./ordenes-proveedores-service
    container_name: ordenes-proveedores-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}
      INVENTARIO_SERVICE_URL: http://inventario-service:8082

  usuarios-service:
    build:
      context: ./usuarios
    container_name: usuarios-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}
      TT_MAIL_USERNAME: ${TT_MAIL_USERNAME}
      TT_MAIL_PASSWORD: ${TT_MAIL_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  ventas-service:
    build:
      context: ./ventas-service
    container_name: ventas-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      TT_DATASOURCE_URL: ${TT_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/TiendaTechV19}
      TT_DATASOURCE_USERNAME: ${TT_DATASOURCE_USERNAME:-postgres}
      TT_DATASOURCE_PASSWORD: ${TT_DATASOURCE_PASSWORD:-postgres}
      INVENTARIO_SERVICE_URL: http://inventario-service:8082

  # Entrega 3: cluster de datos distribuido. El perfil evita modificar el
  # arranque normal de los servicios mientras se completa la migración.
  crdb-1:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-1
    profiles: ["e3-crdb"]
    command:
      - start
      - --insecure
      - --advertise-addr=crdb-1:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=crdb-1:26257,crdb-2:26257,crdb-3:26257
      - --locality=region=local,zone=z1
    ports:
      - "26257:26257"
      - "8091:8080"
    volumes:
      - crdb1-data:/cockroach/cockroach-data
    networks: [pfc-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach node status --insecure --host=localhost:26257 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  crdb-2:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-2
    profiles: ["e3-crdb"]
    command:
      - start
      - --insecure
      - --advertise-addr=crdb-2:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=crdb-1:26257,crdb-2:26257,crdb-3:26257
      - --locality=region=local,zone=z2
    ports:
      - "26258:26257"
      - "8092:8080"
    volumes:
      - crdb2-data:/cockroach/cockroach-data
    networks: [pfc-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach node status --insecure --host=localhost:26257 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  crdb-3:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-3
    profiles: ["e3-crdb"]
    command:
      - start
      - --insecure
      - --advertise-addr=crdb-3:26257
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
      - --join=crdb-1:26257,crdb-2:26257,crdb-3:26257
      - --locality=region=local,zone=z3
    ports:
      - "26259:26257"
      - "8093:8080"
    volumes:
      - crdb3-data:/cockroach/cockroach-data
    networks: [pfc-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach node status --insecure --host=localhost:26257 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  crdb-init:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-init
    profiles: ["e3-crdb"]
    depends_on:
      crdb-1:
        condition: service_started
      crdb-2:
        condition: service_started
      crdb-3:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        cockroach init --insecure --host=crdb-1:26257 2>/dev/null || true;
        cockroach sql --insecure --host=crdb-1:26257 --file=/docs/db/schema.sql
    volumes:
      - ./docs/db/schema.sql:/docs/db/schema.sql:ro
    networks: [pfc-net]
    restart: "no"

volumes:
  crdb1-data:
  crdb2-data:
  crdb3-data:

networks:
  pfc-net:
    driver: bridge
