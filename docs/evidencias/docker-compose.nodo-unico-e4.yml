# Nodo unico de CockroachDB, exclusivo para el Paso 5.6 (comparativa de planes
# de ejecucion, cluster vs nodo unico). No reemplaza al docker-compose.override.yml
# de desarrollo que el equipo borro; es un compose separado, con su propio
# puerto (26260 en el host, para no chocar con el cluster de 3 nodos en
# 26257-26259), su propia red y su propio volumen, pensado para vivir junto al
# cluster de docker-compose.db.yml sin interferir con el.
#
# Uso: docs/evidencias/preparar-nodo-unico-e4.ps1 lo levanta y lo carga con el
# mismo dataset determinista (docs/db/schema.sql, seeds.sql y
# seed-catalogo-sintetico.sql) que ya tiene el cluster, para que la
# comparacion de planes sea sobre volumenes identicos.
#
# listen-addr/http-addr quedan en loopback (127.0.0.1) a proposito: en modo
# --insecure, "start-single-node" de CockroachDB rechaza escuchar en 0.0.0.0
# ("hostname of listen_addr must be 127.0.0.1 or localhost"), como candado de
# seguridad propio de ese comando. No hace falta publicar puertos al host
# porque todo este flujo (preparar-nodo-unico-e4.ps1, comparar-planes-e4.ps1)
# accede via "docker exec ... --host=localhost:26257", dentro del propio
# contenedor.
#
# --max-offset=5s (el resto del proyecto usa el valor por defecto de
# CockroachDB, 500ms): el reloj de la VM de WSL2/Docker Desktop de esta
# maquina se ha desincronizado de forma repetida durante esta entrega
# ("remote wall time is too far ahead"), incluso despues de "wsl --shutdown".
# Un limite mas holgado evita que la carga masiva de seeds.sql aborte a mitad
# de camino por un salto de reloj transitorio del host. No afecta la
# comparacion de planes del Paso 5.6: max-offset acota la tolerancia a
# desfase de reloj para consistencia transaccional, no el tiempo que reporta
# EXPLAIN ANALYZE en lecturas simples sin contencion, que es lo que se mide.
services:
  tiendatech-crdb-nodo-unico:
    image: cockroachdb/cockroach:v23.2.4
    container_name: tiendatech-crdb-nodo-unico
    command:
      - start-single-node
      - --insecure
      - --store=/cockroach/cockroach-data
      - --listen-addr=127.0.0.1:26257
      - --http-addr=127.0.0.1:8080
      - --cache=64MiB
      - --max-sql-memory=64MiB
      - --max-offset=5s
    volumes:
      - crdb-nodo-unico-data:/cockroach/cockroach-data
    networks: [tiendatech-nodo-unico-net]
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  crdb-nodo-unico-data:

networks:
  tiendatech-nodo-unico-net:
    name: tiendatech-nodo-unico-net
    driver: bridge
